{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>

<body>

<h2>Forgot Password</h2>

<form method="POST">

    {% csrf_token %}

    <input type="email" name="email" placeholder="Enter Email" required>

    <button type="submit">Continue</button>

</form>

{% for message in messages %}
<p>{{ message }}</p>
{% endfor %}

</body>
</html>
