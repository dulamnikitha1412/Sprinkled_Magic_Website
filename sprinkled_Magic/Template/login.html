{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="{% static 'images/icon.jpg' %}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            padding:50px 70px;
            background-image:url("{% static 'images/reg.png' %}");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;

            display:flex;
            justify-content:flex-end;
            align-items:center;
        }

        .login-box{
            width:420px;
            background:rgba(253,248,243,0.96);
            padding:44px 40px;
            border-radius:24px;
            box-shadow:0 24px 64px rgba(92,61,46,0.2);
            position:relative;
            overflow:hidden;
        }

        .login-box::before{
            content:'';
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:4px;
            background:linear-gradient(90deg,#f5879e,#e8486a,#f5879e);
        }

        .msg-error { background:#ffe5e5; color:#c62828; border-left:3px solid #e8486a; }
        .msg-success { background:#e8f5e9; color:#2e7d32; border-left:3px solid #66bb6a; }

        .logo-icon{
            width:70px;
            height:70px;
            margin:auto;
            margin-bottom:20px;
            border-radius:50%;
            background:linear-gradient(135deg,#f5879e,#e8486a);

            display:flex;
            justify-content:center;
            align-items:center;

            color:white;
            font-size:30px;
            box-shadow:0 8px 24px rgba(232,72,106,0.35);
        }

        .title{
            text-align:center;
            font-size:23px;
            color:#3b2315;
            font-family:'Playfair Display',serif;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .line{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            margin-bottom:30px;
        }

        .line hr{
            width:60px;
            border:none;
            border-top:1px solid #edd8cc;
        }

        .line span{
            color:#e8486a;
            font-size:20px;
        }

        .input-box{
            position:relative;
            margin-bottom:20px;
        }

        .input-box i{
            position:absolute;
            left:18px;
            top:50%;
            transform:translateY(-50%);
            color:#b8aaa0;
            font-size:20px;
        }

        .input-box input{
            width:100%;
            height:56px;
            padding-left:52px;
            border:1.5px solid #edd8cc;
            border-radius:10px;
            background:rgba(255,255,255,0.85);
            font-size:15px;
            color:#3b2315;
        }

        .input-box input:focus{
            outline:none;
            border-color:#f5879e;
            box-shadow:0 0 0 3px rgba(232,72,106,0.12);
        }

        .input-box input::placeholder{
            color:#c3a898;
        }

        .login-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:linear-gradient(135deg,#f5879e,#e8486a);
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            margin-top:10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(232, 72, 106, 0.5);
            filter: brightness(1.06);
        }
 
        .login-btn:active {
            transform: translateY(0);
        }
 
        .register-text{
            text-align:center;
            margin-top:20px;
            font-size: 14px;
            color:#9e8070;
        }

        .register-text a{
            text-decoration:none;
            color:#e8486a;
            font-weight:600;
            margin-left: 4px;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .forgot-link{
            text-align: right;
            margin: 10px 0 20px;
        }

        .forgot-link a{
            text-decoration: none;
            color: #ff4f7b;
            font-size: 14px;
            font-weight: 500;
        }

        .forgot-link a:hover{
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo-icon">
            <i class="bi bi-cake2-fill"></i>
        </div>

        <h1 class="title">Welcome Back</h1>

        <div class="line">
            <hr><span>♥</span><hr>
        </div>


        <form method="POST">
            {% csrf_token %}

            {% if success_message %}
            <div style="background:#e8f5e9;color:#2e7d32;border-left:4px solid #66bb6a;padding:14px 16px;border-radius:10px;margin-bottom:18px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;">
                <i class="bi bi-check-circle-fill" style="font-size:18px;color:#66bb6a;"></i>
                {{ success_message }}
            </div>
            {% endif %}

            {% if error_message %}
            <div style="background:#ffe5e5;color:#c62828;border-left:4px solid #e8486a;padding:14px 16px;border-radius:10px;margin-bottom:18px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;">
                <i class="bi bi-x-circle-fill" style="font-size:18px;color:#e8486a;"></i>
                {{ error_message }}
            </div>
            {% endif %}

            <div class="input-box">
                <i class="bi bi-person"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="input-box">
                <i class="bi bi-lock"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>

                <div class="forgot-link">
                    <a href="{% url 'forgot_password' %}">
                        Forgot Password?
                    </a>
                </div>


            <button type="submit" class="login-btn">
                Login
            </button>

            <p class="register-text">
                Don't have an account?
                <a href="{% url 'reg' %}">Register</a>
            </p>

        </form>

   
</body>

</body>
</html>
